<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Passport - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0a0b0e;
            color: white;
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }

        /* NFTs Grid */
        .nfts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Create NFT Button */
        .create-nft-container {
            text-align: center;
            margin: 20px 0 40px;
        }

        .create-nft-btn {
            background: linear-gradient(145deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .create-nft-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0,255,255,0.5);
        }

        /* NFT Card */
        .nft-card-advanced {
            position: relative;
            width: 100%;
            padding: 20px;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 2px solid rgba(0,255,255,0.3);
            box-shadow: 0 0 50px rgba(0,255,255,0.2);
            transition: all 0.3s;
        }

        .nft-card-advanced:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 70px rgba(0,255,255,0.3);
        }

        .nft-id-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,255,255,0.2);
            border: 1px solid #00ffff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            color: #00ffff;
            font-weight: bold;
            z-index: 10;
        }

        .glitch-wrapper {
            text-align: center;
            margin-bottom: 15px;
        }

        .glitch {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0.05em 0 0 rgba(255,0,0,0.75),
                        -0.025em -0.05em 0 rgba(0,255,0,0.75),
                        0.025em 0.05em 0 rgba(0,0,255,0.75);
            animation: glitch 500ms infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.05em -0.025em 0 rgba(0,255,0,0.75), -0.025em 0.05em 0 rgba(0,0,255,0.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255,0,0,0.75), -0.025em -0.025em 0 rgba(0,255,0,0.75), -0.025em -0.05em 0 rgba(0,0,255,0.75); }
        }

        .nft-3d-card {
            width: 100%;
            height: 380px;
            perspective: 1000px;
            margin-bottom: 15px;
        }

        .nft-inner {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-10px) rotateY(5deg); }
        }

        .nft-front {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, rgba(30,40,60,0.9), rgba(15,20,35,0.95));
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0,255,255,0.3);
            border-radius: 30px;
            overflow: hidden;
        }

        .nft-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .nft-circuit {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
        }

        .nft-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .nft-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,255,255,0.2);
            border: 1px solid #00ffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #00ffff;
        }

        .nft-avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #00ffff, #ff00ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 3px solid white;
            box-shadow: 0 0 30px rgba(0,255,255,0.5);
        }

        .nft-avatar span {
            font-size: 45px;
            color: white;
        }

        .nft-username {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(145deg, #fff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .nft-wallet-container {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(0,255,255,0.3);
        }

        .nft-wallet-label {
            font-size: 8px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .nft-wallet {
            font-size: 11px;
            color: #4caf50;
            font-family: monospace;
            word-break: break-all;
        }

        .nft-stats {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
            background: rgba(0,255,255,0.1);
            border-radius: 15px;
            padding: 8px 5px;
            border: 1px solid rgba(0,255,255,0.3);
        }

        .stat-label {
            display: block;
            font-size: 9px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .stat-value {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #00ffff;
        }

        .nft-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .open-dashboard-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(145deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .open-dashboard-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0,255,255,0.5);
            box-shadow: 0 0 20px #00ffff;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,255,255,0.03) 0px, transparent 2px);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- NFTs Container - Grid Layout -->
    <div class="nfts-grid" id="nftsContainer"></div>

    <!-- Create New NFT Button -->
    <div class="create-nft-container">
        <button class="create-nft-btn" onclick="createNewNFT()">
            <i class="fas fa-plus-circle"></i> CREATE NEW NFT
        </button>
    </div>

    <!-- Template for NFT Card (hidden) -->
    <template id="nftTemplate">
        <div class="nft-card-advanced">
            <div class="glitch-wrapper">
                <div class="glitch" data-text="PASSPORT NFT">PASSPORT NFT</div>
            </div>
            
            <div class="nft-3d-card">
                <div class="nft-inner">
                    <div class="nft-front">
                        <div class="nft-glow"></div>
                        <div class="nft-circuit"></div>
                        <div class="nft-content">
                            <div class="nft-badge">⚡ GENESIS</div>
                            <div class="nft-avatar">
                                <span class="nft-avatar-letter">👤</span>
                            </div>
                            <div class="nft-username">Loading...</div>
                            <div class="nft-wallet-container">
                                <div class="nft-wallet-label">WALLET</div>
                                <div class="nft-wallet">0x7a9...f3b2</div>
                            </div>
                            
                            <div class="nft-stats">
                                <div class="stat-item">
                                    <span class="stat-label">SLOTS</span>
                                    <span class="stat-value" id="nft-slots">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">INCOME</span>
                                    <span class="stat-value" id="nft-income">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="nft-buttons">
                <button class="open-dashboard-btn" onclick="openDashboard(this)">
                    <span class="btn-text">OPEN DASHBOARD</span>
                </button>
            </div>
            
            <div class="nft-id-badge" id="nft-id-display">#00000</div>
            
            <div class="scan-line"></div>
            <div class="grid-overlay"></div>
        </div>
    </template>

    <!-- Dashboard Page (Hidden by default) -->
    <div id="dashboardPage" class="dashboard-page" style="display: none;">
        <!-- Back button will be here -->
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">Action Successful!</div>

    <script>
        // Global state
        let nfts = [];
        let nftCounter = 1000;
        let username = 'User';

        window.onload = function() {
            const savedData = localStorage.getItem('passportData');
            if (savedData) {
                const data = JSON.parse(savedData);
                username = data.username;
                createFirstNFT(data);
            } else {
                createFirstNFT({
                    username: 'Crypto User',
                    walletAddress: generateRandomWallet()
                });
            }
        };

        function generateRandomWallet() {
            const chars = '0123456789abcdef';
            let address = '0x';
            for (let i = 0; i < 40; i++) {
                address += chars[Math.floor(Math.random() * chars.length)];
            }
            return address;
        }

        function formatWallet(address) {
            return address.substring(0, 6) + '...' + address.substring(address.length - 4);
        }

        function generateRandomNFTId() {
            return Math.floor(10000 + Math.random() * 90000);
        }

        function createFirstNFT(data) {
            const template = document.getElementById('nftTemplate');
            const clone = template.content.cloneNode(true);
            const nftCard = clone.querySelector('.nft-card-advanced');
            
            const nftId = nftCounter++;
            const randomWallet = generateRandomWallet();
            
            nftCard.dataset.nftId = nftId;
            nftCard.dataset.wallet = randomWallet;
            
            updateNFTCard(nftCard, {
                username: data.username,
                nftId: `#${generateRandomNFTId()}`,
                wallet: randomWallet
            });
            
            document.getElementById('nftsContainer').appendChild(nftCard);
            nfts.push(nftCard);
        }

        function createNewNFT() {
            const template = document.getElementById('nftTemplate');
            const clone = template.content.cloneNode(true);
            const nftCard = clone.querySelector('.nft-card-advanced');
            
            const nftId = nftCounter++;
            const randomWallet = generateRandomWallet();
            
            nftCard.dataset.nftId = nftId;
            nftCard.dataset.wallet = randomWallet;
            
            updateNFTCard(nftCard, {
                username: username,
                nftId: `#${generateRandomNFTId()}`,
                wallet: randomWallet
            });
            
            document.getElementById('nftsContainer').appendChild(nftCard);
            nfts.push(nftCard);
            
            showToast(`New NFT #${nftId} created!`);
        }

        function updateNFTCard(card, data) {
            card.querySelector('.nft-avatar-letter').textContent = data.username.charAt(0).toUpperCase();
            card.querySelector('.nft-username').textContent = data.username;
            card.querySelector('.nft-wallet').textContent = formatWallet(data.wallet);
            card.querySelector('#nft-id-display').textContent = data.nftId;
        }

        function openDashboard(button) {
            alert('Dashboard will open here');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerHTML = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        window.createNewNFT = createNewNFT;
        window.openDashboard = openDashboard;
    </script>
</body>
</html>
